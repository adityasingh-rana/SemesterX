<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SemesterX</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07080c;
      --bg2: #0d0f17;
      --card: rgba(20, 24, 36, .8);
      --bd: #242a3c;
      --tx: #e8eaf2;
      --mu: #8b92a8;
      --bl: #3d8bff;
      --pu: #8b5cf6;
      --go: #f5b942;
      --gr: #22c55e;
      --rd: #ef4444;
      color-scheme: dark;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    :root[data-theme=light] {
      --bg: #eef1f7;
      --bg2: #fff;
      --card: #fff;
      --bd: #d6dbe8;
      --tx: #161a26;
      --mu: #586079;
      color-scheme: light
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0
    }

    body {
      background: radial-gradient(900px 500px at 80% -10%, #3d8bff22, transparent), var(--bg);
      color: var(--tx);
      font: 15px/1.5 'Space Grotesk', system-ui, sans-serif;
      min-height: 100vh
    }

    #side {
      position: fixed;
      inset: 0 auto 0 0;
      width: 220px;
      background: var(--bg2);
      border-right: 1px solid var(--bd);
      padding: 16px 10px;
      overflow: auto;
      z-index: 5;
      transition: transform .2s
    }

    #side b {
      display: block;
      padding: 4px 10px 14px;
      letter-spacing: .5px;
      color: var(--bl);
      font-size: 17px
    }

    #side a {
      display: block;
      padding: 9px 12px;
      border-radius: 8px;
      color: var(--mu);
      cursor: pointer;
      margin: 2px 0
    }

    #side a:hover {
      color: var(--tx)
    }

    #side a.on {
      background: #3d8bff22;
      color: var(--tx);
      box-shadow: inset 2px 0 var(--bl)
    }

    #main {
      margin-left: 220px;
      padding: 16px 22px 60px;
      max-width: 1200px
    }

    #top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px
    }

    #top .mu {
      font-size: 13px
    }

    .mu {
      color: var(--mu)
    }

    .g {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr))
    }

    .g2 {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr))
    }

    .c {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 14px;
      backdrop-filter: blur(8px)
    }

    .c h3 {
      margin: 0 0 8px;
      font-size: 15px
    }

    .st b {
      display: block;
      font-size: 26px;
      color: var(--bl)
    }

    .st span {
      font-size: 12px;
      color: var(--mu)
    }

    .hero {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      justify-content: space-between;
      align-items: center;
      padding: 24px;
      border-radius: 14px;
      border: 1px solid #3d8bff66;
      background: linear-gradient(120deg, #3d8bff22, #8b5cf622);
      box-shadow: 0 0 30px #3d8bff22;
      margin-bottom: 12px
    }

    h1 {
      margin: 0 0 4px;
      font-size: clamp(24px, 4vw, 38px);
      line-height: 1.1;
      letter-spacing: -.5px
    }

    .chip {
      display: inline-block;
      border: 1px solid var(--bd);
      background: var(--bg2);
      border-radius: 99px;
      padding: 3px 11px;
      margin: 3px 4px 3px 0;
      font-size: 13px
    }

    .cd {
      text-align: center
    }

    .cd b {
      font-size: 60px;
      line-height: 1;
      color: var(--rd)
    }

    .cd span {
      display: block;
      font-size: 12px;
      color: var(--mu)
    }

    .btn {
      background: linear-gradient(90deg, var(--bl), var(--pu));
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 9px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px
    }

    .ghost {
      background: none;
      border: 1px solid var(--bd);
      color: var(--tx);
      border-radius: 8px;
      padding: 6px 11px;
      font: inherit;
      cursor: pointer
    }

    .ghost:hover {
      border-color: var(--bl)
    }

    .sm {
      padding: 2px 8px;
      font-size: 12px;
      margin: 0
    }

    .bar {
      height: 8px;
      background: var(--bd);
      border-radius: 9px;
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      border-radius: 9px;
      transition: width .6s
    }

    .bl {
      margin: 9px 0;
      font-size: 13px;
      display: flex;
      justify-content: space-between
    }

    .ring {
      --p: 0;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: conic-gradient(var(--gr) calc(var(--p)*1%), var(--bd) 0);
      display: grid;
      place-items: center;
      margin: auto;
      transition: .6s
    }

    .ring div {
      width: 118px;
      height: 118px;
      border-radius: 50%;
      background: var(--bg2);
      display: grid;
      place-items: center;
      font-size: 30px;
      font-weight: 700
    }

    input,
    select,
    textarea {
      background: var(--bg2);
      color: var(--tx);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 7px 9px;
      font: inherit;
      max-width: 100%
    }

    textarea {
      width: 100%;
      min-height: 80px
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 8px 0
    }

    .t {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 8px 0;
      border-top: 1px solid var(--bd)
    }

    .t .n {
      flex: 1 1 180px
    }

    .k {
      display: flex;
      gap: 4px
    }

    .k label {
      font-size: 11px;
      border: 1px solid var(--bd);
      border-radius: 6px;
      padding: 2px 6px;
      cursor: pointer;
      color: var(--mu);
      user-select: none
    }

    .k input {
      display: none
    }

    .k label.on {
      background: #22c55e22;
      border-color: var(--gr);
      color: var(--gr)
    }

    .k label.pop {
      animation: pop .4s
    }

    @keyframes pop {
      50% {
        transform: scale(1.25)
      }
    }

    .subject-toggle,
    .module-toggle {
      display: flex;
      align-items: center;
      gap: 9px;
      background: none;
      border: 0;
      color: var(--tx);
      font: inherit;
      text-align: left;
      cursor: pointer;
      padding: 5px 0;
      min-width: 0
    }

    .subject-toggle {
      font-size: 17px;
      font-weight: 700;
      flex: 1
    }

    .module-toggle {
      font-size: 14px;
      font-weight: 700;
      flex: 1
    }

    .subject-toggle:hover,
    .module-toggle:hover {
      color: var(--bl)
    }

    .module-panel {
      margin: 10px 0 0 10px;
      padding: 10px;
      border: 1px solid var(--bd);
      border-radius: 10px;
      background: var(--bg2)
    }

    .accordion-hint {
      color: var(--mu);
      font-size: 12px;
      margin: 4px 0 0
    }

    .xp-link {
      cursor: pointer
    }

    .xp-link:hover {
      border-color: var(--go);
      color: var(--go)
    }

    .lv {
      border-left: 4px solid var(--bl)
    }

    .lv.l2 {
      border-color: var(--pu)
    }

    .lv.l3 {
      border-color: var(--rd);
      background: linear-gradient(120deg, #ef444422, var(--card))
    }

    .lock {
      opacity: .5
    }

    .ach {
      text-align: center
    }

    .ach b {
      font-size: 30px;
      display: block
    }

    .ach.no {
      opacity: .35;
      filter: grayscale(1)
    }

    .ach.ok {
      border-color: var(--go);
      box-shadow: 0 0 16px #f5b94233
    }

    .ch {
      width: 100%;
      height: 100px
    }

    .don {
      width: 130px;
      height: 130px;
      border-radius: 50%
    }

    .hm {
      display: grid;
      grid-template-columns: repeat(14, 1fr);
      gap: 3px
    }

    .hm i {
      aspect-ratio: 1;
      background: var(--gr);
      border-radius: 3px
    }

    #toasts {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 20;
      display: grid;
      gap: 6px
    }

    .toast {
      background: var(--bg2);
      border: 1px solid var(--go);
      color: var(--go);
      padding: 8px 14px;
      border-radius: 9px;
      animation: up .3s;
      box-shadow: 0 0 16px #f5b94244
    }

    @keyframes up {
      from {
        transform: translateY(12px);
        opacity: 0
      }
    }

    dialog {
      background: var(--bg2);
      color: var(--tx);
      border: 1px solid var(--bl);
      border-radius: 12px;
      width: min(520px, 94vw)
    }

    dialog::backdrop {
      background: #000a
    }

    dialog input,
    dialog select {
      width: 100%;
      margin: 4px 0
    }

    .tm {
      font-size: 64px;
      font-weight: 700;
      text-align: center;
      font-variant-numeric: tabular-nums
    }

    .q {
      font-size: 18px;
      font-weight: 700;
      color: var(--go);
      text-align: center;
      padding: 16px
    }

    #mb {
      display: none
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: var(--mu);
      border: 1px dashed var(--bd);
      border-radius: 12px
    }

    .done {
      text-decoration: line-through;
      color: var(--mu)
    }

    @media(max-width:800px) {
      #side {
        transform: translateX(-100%)
      }

      #side.open {
        transform: none
      }

      #main {
        margin-left: 0;
        padding: 12px
      }

      #mb {
        display: inline-block
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>

  <script>
